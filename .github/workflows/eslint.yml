name: Lint

on:
  pull_request:
  push:
    branches:
      - main

# Read-only on the repo (only `checkout` needs it); this job lints and reports
# a status, never writing back to git. Least-privilege token, matching
# otbeat-ingest.yml.
permissions:
  contents: read

# Cancel a stale run when a newer commit is pushed to the same PR ref —
# successive fixups shouldn't burn parallel runners when only the latest
# matters. Gated to non-main refs so every commit on `main` keeps a completed
# CI verdict (back-to-back merges must not cancel an earlier commit's run).
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Read-only job — don't leave the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/node-setup

      - name: Lint
        # `eslint .` over the whole repo. #304 restored nine migration-era rules
        # to `error` in eslint.config.mjs, but they were enforced only on
        # developers' machines — this gate is what makes "restore to `error`"
        # actually stick, so a future PR can't silently regrow the backlog.
        # Runs the `lint` script (plain `eslint .`): it fails on `error`-level
        # rules while tolerating the deliberate `no-unused-vars` `warn` that
        # honors the leading-underscore convention.
        run: npm run lint

      - name: Check formatting
        # The backstop for the pre-commit hook (#398). The hook formats staged
        # files automatically, but it can be skipped with `--no-verify`, it
        # doesn't exist for anyone who cloned without running `npm install`,
        # and it never runs on a commit made through the GitHub web UI. Without
        # this gate the tree drifts back out of format silently — which is
        # exactly how it reached 327 unformatted files before the sweep.
        #
        # Runs after eslint rather than before: a formatting failure is
        # trivially fixed with `npm run format`, so the more substantive lint
        # errors are worth surfacing first.
        run: npm run format:check
