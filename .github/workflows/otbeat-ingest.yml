name: OTbeat ingest

on:
  schedule:
    # Daily 07:00 UTC (~midnight Pacific): the evening's classes have already
    # emailed their OTbeat summaries, and life's gym-visits republisher runs at
    # 08:00 UTC -- one hour later -- so a class reaches the telemetry warehouse
    # (and the fitness dashboard's pace stat) the same night, instead of up to
    # a week later on the old Monday-weekly cadence (life#221). The import's
    # 8-day lookback dwarfs the daily cadence, so missed/failed runs self-heal
    # without gaps or duplicates (append-only, dedupe by started_at).
    - cron: '0 7 * * *'
  # Manual trigger for the first run and ad-hoc catch-ups.
  workflow_dispatch: {}

# Read-only on the repo (only `checkout` needs it); the job writes to
# Supabase, not back to git, so no `contents: write`.
permissions:
  contents: read

# Never run two ingests at once (e.g. a manual run during a scheduled one).
concurrency:
  group: otbeat-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/node-setup

      - name: Ingest new OTbeat sessions into Supabase
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run import-otbeat

      # Heartbeat (#456). Last, so a row means the whole job succeeded. An
      # alert outside GitHub on `max(ran_at)` catches the run that never
      # happens, which no step in this file can.
      - name: Record the heartbeat
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/record-ingest-run.mjs otbeat-ingest

  # Delivery, not detection (#456): the ingest's own gates turn bad data into a
  # red job, and this makes a red job reach a human as an issue in the tracker.
  # A separate job so `issues: write` and `actions: read` never sit next to the
  # production credentials above. `always()` so it also runs after a success,
  # to close an open alert as recovered.
  alert:
    needs: ingest
    # Only for runs of main. A manual run from a feature branch (testing a
    # workflow change) must not file, comment on, or close the real alert.
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Report the result
        uses: ./.github/actions/ingest-alert
        with:
          job: otbeat-ingest
          result: ${{ needs.ingest.result }}
          token: ${{ github.token }}
